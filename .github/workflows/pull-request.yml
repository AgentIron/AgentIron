name: Pull Request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev libgbm-dev libpipewire-0.3-dev librsvg2-dev pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cd src-tauri && cargo fmt -- --check

      - name: Run clippy
        run: cd src-tauri && cargo clippy -- -D warnings

      - name: Run Rust tests
        run: cd src-tauri && cargo test

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: "10"

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm run lint

      - name: Build frontend
        run: pnpm run build

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: audit
        continue-on-error: true
        run: |
          cd src-tauri
          cargo audit > audit-output.txt 2>&1

      - name: Comment audit output
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- cargo-audit-report -->";
            const auditStatus = "${{ steps.audit.outcome }}";
            const outputPath = "src-tauri/audit-output.txt";
            const rawOutput = fs.existsSync(outputPath)
              ? fs.readFileSync(outputPath, "utf8")
              : "cargo audit did not produce output.";
            const output = rawOutput.length > 60000
              ? `${rawOutput.slice(0, 60000)}\n\n[output truncated]`
              : rawOutput;
            const body = `${marker}\n## cargo audit\n\nStatus: **${auditStatus}**\n\n\`\`\`text\n${output}\n\`\`\``;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    needs: [rust-checks, frontend-checks]
    if: always()
    steps:
      - name: Verify required checks passed
        run: |
          if [[ "${{ needs.rust-checks.result }}" != "success" ]]; then
            echo "rust-checks failed"
            exit 1
          fi

          if [[ "${{ needs.frontend-checks.result }}" != "success" ]]; then
            echo "frontend-checks failed"
            exit 1
          fi

          echo "All PR checks passed"
