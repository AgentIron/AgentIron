[package]
name = "agentiron"
version = "0.1.0"
description = "Cross-platform AI agent client for iron-core"
authors = ["AgentIron"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "agentiron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
iron-core = { version = "0.1.35", features = ["embedded-python"] }
# Must track the iron-providers version iron-core itself depends on. A mismatch
# resolves two copies of the crate, and `impl Provider for ProviderConnection`
# applies to iron-core's copy only.
iron-providers = "0.2.14"

# Pinned to 0.10.1 in Cargo.lock: 0.10.2 moved compact_str ^0.9 -> ^0.10 in a
# patch release, but ruff_python_ast (via monty, embedded-python) still holds
# compact_str 0.9. Both in one graph means GetSize is implemented for a
# CompactString that is a different type, and iron-core fails to build.
# Declared here only to hold the resolution; agentiron never imports it.
# Upstream: https://github.com/AgentIron/iron-core/issues/102
get-size2 = "=0.10.1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
xcap = "0.3"
image = "0.25"
base64 = "0.22"
tauri-plugin-dialog = "2"

# Force reqwest to use native-tls instead of rustls
# (rustls build script blocked by Windows Application Control policy)
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream", "multipart", "charset", "http2", "system-proxy"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
