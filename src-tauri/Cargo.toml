[package]
name = "agentiron"
version = "0.1.8"
description = "Cross-platform AI agent client for iron-core"
authors = ["AgentIron"]
license = "Apache-2.0"
edition = "2021"
# The crate builds two binaries: this GUI app and the headless scheduler runner
# in src/bin. tauri-cli ships both, but it only marks one as the application,
# and for a crate with no explicit [[bin]] sections `default-run` is the only
# thing it consults to decide which. Leaving it unset made it pick the runner,
# producing installers that contained the CLI and no GUI at all.
default-run = "agentiron"

[lib]
name = "agentiron_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
iron-core = { version = "0.1.39", features = ["embedded-python"] }
iron-providers = "0.2.15"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
xcap = "0.9.6"
image = "0.25"
base64 = "0.22"
keyring = "4.1.5"
tauri-plugin-dialog = "2"

# Force reqwest to use native-tls instead of rustls
# (rustls build script blocked by Windows Application Control policy)
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "stream", "multipart", "charset", "http2", "system-proxy", "cookies"] }
rusqlite = { version = "0.39", features = ["bundled", "chrono"] }
futures = "0.3"
chrono = "0.4"
time = "=0.3.53"
async-trait = "0.1"
tempfile = "3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
